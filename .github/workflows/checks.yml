name: Game checks

on:
  pull_request:
    branches: [main, "codex/**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Test game rules
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build the game
        run: npm run build
      - name: Verify Vercel build output
        run: node scripts/check-vercel-build.mjs
      - name: Start production multiplayer preview
        run: GAME_SQLITE_PATH=/tmp/final-exam-ci.sqlite npm start > /tmp/final-exam-server.log 2>&1 &
      - name: Wait for preview
        run: node scripts/wait-for-game.mjs
      - name: Test HTTP multiplayer and profile contracts
        run: |
          node tests/integration.mjs
          node tests/profiles-http.mjs
          node tests/race-http.mjs
          node tests/fresh-http.mjs
      - name: Show server diagnostics on failure
        if: failure()
        run: cat /tmp/final-exam-server.log
